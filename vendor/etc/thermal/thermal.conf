[policy_type]
# V1.22
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[mtk-skin-control]
sensor= vtskin1
max_target_tj= 85000
min_target_tj= 85000
trip_tpcb= 78000
target_tpcb= 80000

[vtskin-param]
sensor= vtskin1
operation= coefficient
ref_sensor= [ap_ntc,chg_ntc,battery]
ref_coef= [82600000,-18900000,35900000]

[thermalhal-threshold]
type= SKIN
sensor= vtskin1
level= [severe, critical, emergency, shutdown]
threshold= [47900, 55000, 97000, 98000]
hysteresis= [2000, 7100, 1000, 1000]

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [ap_ntc,chg_ntc,battery]
ref_sensor_class=[kernel,kernel,kernel]
operation= coefficient
coef= [0.817,-0.181,0.364]
offset=-400
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [ap_ntc,chg_ntc,battery]
ref_sensor_class=[kernel,kernel,kernel]
operation= coefficient
coef= [0.712,-0.190,0.478]
offset=0
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[mtk-cpu-table-mapping]
mode= enabled
sensor= back_temp
cluster= 0
threshold= [39000, 40000, 42000, 44000, 46000]
hysteresis= [1000, 1000, 2000, 2000, 2000]
freq= [1900000, 1700000, 1600000, 1500000, 1400000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= back_temp
cluster= 1
threshold= [39000, 40000, 42000, 44000, 46000, 47000]
hysteresis= [1000, 1000, 2000, 2000, 2000, 1000]
freq= [2300000, 2100000, 2000000, 1900000, 1700000, 1500000]

[charger-cooler]
mode= enabled
sensor= front_temp
threshold= [35000, 36000, 37000, 38000, 40000]
hysteresis= [1000, 1000, 1000, 1000, 2000]
current= [5000, 4000, 3000, 2000, 1000]

[general-cooler]
sensor= front_temp
sensor_class= kernel
cooler= moto_wlc
cooler_class= kernel
algorithm= table_mapping
threshold= [34000, 35000, 36000, 37000, 38000, 40000, 42000]
hysteresis= [1000, 1000, 1000, 1000, 1000, 2000, 2000]
limit_state= [1, 2, 3, 4, 5, 6, 7]
